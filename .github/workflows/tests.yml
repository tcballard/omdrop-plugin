name: PR 39 validation

on:
  push:
    branches: [ci/receiver-peer-disconnect]

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      matrix:
        ref: [cf0ccb4ae5cf560373cac2e5025ad496fcf9b2fa, 96581740ba3ef0547753fd6eefeb94f5ddb22c26]
    runs-on: ubuntu-latest
    # Omarchy is Arch: bin/omdrop needs pacman's vercmp, and the receiver needs
    # python-libarchive-c.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git python openssl python-libarchive-c
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - name: Run tests as a regular user
        # identity.py refuses to create a self-signed identity as root.
        run: |
          useradd --create-home tester
          chown -R tester .
          su tester -c "python3 -m unittest discover -s tests -v"
